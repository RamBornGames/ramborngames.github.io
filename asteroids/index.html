  <body>
    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1" aria-label="Asteroid Fishing game"></canvas>
      <div id="unity-loading-bar" role="status" aria-live="polite">
        <div id="unity-logo"></div>
        <div id="unity-loading-copy">CASTING INTO THE STARFIELD</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      const buildVersion = encodeURIComponent("2026.09.18.1-fc4bda24");

      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js?v=" + buildVersion, { updateViaCache: "none" });
        }
      });

      const canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(message, type) {
        const warningBanner = document.querySelector("#unity-warning");
        const entry = document.createElement("div");
        entry.textContent = message;
        entry.className = type === "error" ? "error" : "warning";
        warningBanner.appendChild(entry);
        warningBanner.style.display = "block";
        if (type !== "error") {
          setTimeout(function () {
            entry.remove();
            warningBanner.style.display = warningBanner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/2026.09.18_build1_asteroidfishing.loader.js?v=" + buildVersion;
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/2026.09.18_build1_asteroidfishing.data.unityweb?v=" + buildVersion,
        frameworkUrl: buildUrl + "/2026.09.18_build1_asteroidfishing.framework.js.unityweb?v=" + buildVersion,
        codeUrl: buildUrl + "/2026.09.18_build1_asteroidfishing.wasm.unityweb?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ramsey Fireborn Games Studio",
        productName: "Asteroid Fishing",
        productVersion: "2026.09.18.1-fc4bda24",
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "flex";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
