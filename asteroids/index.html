    <script>
      const buildVersion = encodeURIComponent("2026.11.28.4-daed1381");

      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const saveBridge = document.querySelector("#player-save-bridge");
      const saveBridgeReady = new Promise(resolve => {
        saveBridge.addEventListener("load", resolve, { once: true });
        saveBridge.addEventListener("error", resolve, { once: true });
      });

      function unityShowBanner(message, type) {
        const warningBanner = document.querySelector("#unity-warning");
        const entry = document.createElement("div");
        entry.textContent = message;
        entry.className = type === "error" ? "error" : "warning";
        warningBanner.appendChild(entry);
        warningBanner.style.display = "block";
        if (type !== "error") {
          setTimeout(function () {
            entry.remove();
            warningBanner.style.display = warningBanner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/2026.11.28_build4_asteroidfishing.loader.js?v=" + buildVersion;
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/2026.11.28_build4_asteroidfishing.data?v=" + buildVersion,
        frameworkUrl: buildUrl + "/2026.11.28_build4_asteroidfishing.framework.js?v=" + buildVersion,
        codeUrl: buildUrl + "/2026.11.28_build4_asteroidfishing.wasm?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ramsey Fireborn Games Studio",
        productName: "Asteroid Fishing",
        productVersion: "2026.11.28.4-daed1381",
        showBanner: unityShowBanner,
      };

      const metricsBase = "https://asteroids-metrics.cfireborn.workers.dev/api/";
      const page = new URL(document.URL);
      const directLaunch = page.search.slice(1).split("&").includes("mode=metronome");
      // Install CTA prototype previews can be reviewed on desktop without reporting visits.
      const preview = page.searchParams.get("install-preview");
      const installPreview = preview === "ios" ? "ios-safari" : preview === "android" ? "android-chrome" : preview;
      const previewingInstall = /^(ios-(safari|chrome|other)|android-(chrome|firefox|samsung|other))$/.test(installPreview);
      const modeMetricsEnabled = !previewingInstall && page.origin === "https://ramborngames.github.io"
        && page.pathname.startsWith("/asteroids/")
        && !navigator.globalPrivacyControl && navigator.doNotTrack !== "1" && window.doNotTrack !== "1";
      const metricsEnabled = modeMetricsEnabled && !directLaunch;
      const navigationKey = "asteroids.metrics.startup";
      let startupOrigin = performance.timeOrigin;
      let foregroundStartup = document.visibilityState === "visible";
      let unityReady = false;
      const installDialog = setupInstallPrompt();

      function detectInstallGuide() {
        const ua = navigator.userAgent;
        const embedded = /(?:FBAN|FBAV|Instagram|GSA\/|;\s*wv\b)/i.test(ua);
        const ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (ios) {
          if (/CriOS\//.test(ua)) return "ios-chrome";
          const otherBrowser = /(?:FxiOS|EdgiOS|OPiOS|DuckDuckGo|Brave)\//.test(ua);
          return !embedded && !otherBrowser && /Version\/[\d.]+.*Safari\//.test(ua) ? "ios-safari" : "ios-other";
        }
        const uaData = navigator.userAgentData;
        if (!/Android/i.test(ua) && uaData?.platform !== "Android") return null;
        if (/Firefox\/|Fennec\//.test(ua)) return "android-firefox";
        if (/SamsungBrowser\//.test(ua)) return "android-samsung";
        const otherBrowser = /(?:EdgA|OPR|DuckDuckGo|Vivaldi|YaBrowser|Brave)\//.test(ua);
        return !embedded && !otherBrowser && /Chrome\//.test(ua) ? "android-chrome" : "android-other";
      }

      function setupInstallPrompt() {
        const dialog = document.querySelector("#install-cta");
        if (!dialog?.showModal) return null;

        const installed = navigator.standalone === true || ["standalone", "fullscreen", "minimal-ui"].some(mode =>
          window.matchMedia(`(display-mode: ${mode})`).matches);
        const guide = previewingInstall ? installPreview : detectInstallGuide();
        if (!guide || (!previewingInstall && (installed || !window.isSecureContext || window.self !== window.top))) return null;

        const dismissKey = "asteroids.install-dismissed";
        const steps = document.querySelector("#install-steps");
        const template = document.querySelector("#install-guide-" + guide);
        if (!steps || !template?.content) return null;
        steps.prepend(template.content.cloneNode(true));
        const install = document.querySelector("#install-native");
        const success = document.querySelector("#install-success");
        let pendingPrompt = null;
        let installStarted = false;

        function renderInstallActions() {
          install.hidden = !pendingPrompt || installStarted;
          steps.hidden = !install.hidden || installStarted;
          success.hidden = !installStarted;
        }

        function rememberDismissal() {
          if (previewingInstall) return;
          try { localStorage.setItem(dismissKey, "1"); } catch {
            // The game remains accessible when browser storage is disabled.
          }
        }

        function show() {
          if (installStarted) return false;
          if (!dialog.open) dialog.showModal();
          return true;
        }

        function acceptInstall() {
          pendingPrompt = null;
          installStarted = true;
          delete window.asteroidsShowInstall;
          rememberDismissal();
          renderInstallActions();
        }

        dialog.addEventListener("close", () => {
          rememberDismissal();
          if (unityReady && document.activeElement === document.body) canvas.focus({ preventScroll: true });
        });
        document.querySelector("#install-close").addEventListener("click", () => dialog.close());
        document.querySelector("#install-continue").addEventListener("click", () => dialog.close());

        if (!previewingInstall && guide.startsWith("android-")) {
          window.addEventListener("beforeinstallprompt", event => {
            if (installStarted) return;
            event.preventDefault();
            pendingPrompt = event;
            renderInstallActions();
          });
          window.addEventListener("appinstalled", acceptInstall);
          install.addEventListener("click", async () => {
            if (!pendingPrompt) return;
            const event = pendingPrompt;
            pendingPrompt = null;
            renderInstallActions();
            try {
              await event.prompt();
              if ((await event.userChoice).outcome === "accepted") acceptInstall();
            } catch {
              // Leave the browser menu instructions available if the native prompt fails.
            }
          });
        }

        renderInstallActions();
        window.asteroidsShowInstall = show;
        let dismissed = false;
        try { dismissed = localStorage.getItem(dismissKey) === "1"; } catch {
          // Show the CTA if the browser cannot read the preference.
        }
        if (previewingInstall || (!directLaunch && !dismissed)) show();
        return dialog;
      }

      if (metricsEnabled) {
        try {
          const saved = sessionStorage.getItem(navigationKey);
          if (saved) {
            sessionStorage.removeItem(navigationKey);
            const previous = JSON.parse(saved);
            const elapsed = startupOrigin - previous.origin;
            if (previous.url === page.href && Number.isFinite(previous.origin) && elapsed >= 0 && elapsed <= 300000) {
              startupOrigin = previous.origin;
              foregroundStartup = foregroundStartup && previous.foreground === true;
            }
          }
        } catch {
          // Storage can be disabled. Timing can still start at this navigation.
        }
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState !== "visible") foregroundStartup = false;
        });
      }

      function rememberStartup(url) {
        if (!metricsEnabled) return;
        try {
          sessionStorage.setItem(navigationKey, JSON.stringify({
            url: url.href, origin: startupOrigin, foreground: foregroundStartup
          }));
        } catch {
          // Navigation can continue when storage is unavailable.
        }
      }

      async function useLatestRelease() {
        const pageUrl = new URL(document.URL);
        const versionUrl = new URL("version.json", pageUrl);
        // A unique URL also bypasses GitHub Pages' CDN cache and older workers' cache keys.
        const checkTime = Date.now();
        versionUrl.searchParams.set("check", checkTime);
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 3000);
        let latestVersion;
        try {
          const response = await fetch(versionUrl, { cache: "no-store", signal: controller.signal });
          if (!response.ok) return true;
          ({ version: latestVersion } = await response.json());
        } catch (error) {
          return true;
        } finally {
          clearTimeout(timeout);
        }

        const releasePattern = /^\d{4}\.\d{2}\.\d{2}\.\d+-[a-f0-9]{8}$/;
        if (typeof latestVersion !== "string" || !releasePattern.test(latestVersion)) return true;
        const currentRelease = config.productVersion.split("-")[0];
        if (latestVersion.split("-")[0].localeCompare(currentRelease, "en", { numeric: true }) <= 0) return true;

        if (pageUrl.searchParams.get("build") === latestVersion) {
          // Let a manual reload retry with a new CDN cache key if publication is still propagating.
          pageUrl.searchParams.delete("build");
          pageUrl.searchParams.delete("build-check");
          history.replaceState(history.state, "", pageUrl.href);
          loadingBar.style.display = "none";
          unityShowBanner("The latest build is still being published. Reload in a moment to try again.", "error");
          return false;
        }

        pageUrl.searchParams.set("build", latestVersion);
        pageUrl.searchParams.set("build-check", checkTime);
        pageUrl.searchParams.delete("sw-reset");
        rememberStartup(pageUrl);
        location.replace(pageUrl.href);
        return false;
      }

      async function prepareServiceWorker() {
        if (!("serviceWorker" in navigator)) return true;

        const serviceWorkerUrl = new URL("ServiceWorker.js?v=" + buildVersion, document.URL).href;
        const controller = navigator.serviceWorker.controller;

        // A previously published worker caches every Build payload. Never start
        // Unity while that worker controls this page: unregister it and make one
        // clean navigation before installing the lightweight worker.
        if (controller && controller.scriptURL !== serviceWorkerUrl) {
          const resetUrl = new URL(document.URL);
          if (resetUrl.searchParams.get("sw-reset") === buildVersion) {
            throw new Error("The previous service worker still controls the page after reset.");
          }

          const registration = await navigator.serviceWorker.getRegistration();
          if (!registration || !(await registration.unregister())) {
            throw new Error("The previous service worker could not be unregistered.");
          }

          resetUrl.searchParams.set("sw-reset", buildVersion);
          rememberStartup(resetUrl);
          location.replace(resetUrl.href);
          return false;
        }

        await navigator.serviceWorker.register(serviceWorkerUrl, { updateViaCache: "none" });
        return true;
      }

      async function reportArcadeVisit() {
        const idKey = "asteroids.metrics.browser";
        const dayKey = "asteroids.metrics.last-day";
        try {
          const today = new Date().toISOString().slice(0, 10);
          if (localStorage.getItem(dayKey) === today) return;

          let id = localStorage.getItem(idKey);
          if (!id) {
            id = crypto.randomUUID();
            localStorage.setItem(idKey, id);
          }
          const response = await fetch(metricsBase + "activity", {
            method: "POST",
            body: id,
            credentials: "omit",
            keepalive: true
          });
          if (response.status === 200) {
            localStorage.setItem(dayKey, await response.text());
          }
        } catch {
          // The next visit can retry when storage or the network is available.
        }
      }

      async function reportStartup() {
        if (!foregroundStartup || document.visibilityState !== "visible") return;
        const elapsed = Math.round((performance.timeOrigin - startupOrigin) + performance.now());
        if (!(elapsed > 0 && elapsed <= 300000)) return;
        const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
          || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        try {
          await fetch(metricsBase + "startup", {
            method: "POST",
            body: (mobile ? "mobile" : "desktop") + "," + elapsed,
            credentials: "omit",
            keepalive: true
          });
        } catch {
          // Startup metrics are best effort.
        }
      }

      function trackModeSessions() {
        // The indices match ArcadeMetrics.Mode in Unity.
        const modes = [null, "rhythm", "puzzle", "tap", "launch"];
        let skipFirstLoad = directLaunch;
        let selection = null;
        let session = null;
        let heartbeat = null;

        async function report(current) {
          const visibleMs = current.visibleSince === null ? 0 : performance.now() - current.visibleSince;
          const playMs = Math.min(86400000, Math.round(current.elapsed + visibleMs));
          if (playMs <= current.sentMs) return;
          current.sentMs = playMs;
          try {
            const response = await fetch(metricsBase + "session", {
              method: "POST",
              body: JSON.stringify({ id: current.id, mode: current.mode, loadMs: current.loadMs, playMs }),
              credentials: "omit",
              keepalive: true
            });
            if (response.ok) return;
          } catch {
            // The next heartbeat can send the latest total again.
          }
          if (current.sentMs === playMs) current.sentMs = -1;
        }

        function pause() {
          if (selection) selection.loadStarted = null;
          if (session?.visibleSince != null) {
            session.elapsed += performance.now() - session.visibleSince;
            session.visibleSince = null;
            report(session);
          }
        }

        function resume() {
          if (session && document.visibilityState === "visible") session.visibleSince ??= performance.now();
        }

        function leave() {
          selection = null;
          if (!session) return;
          clearInterval(heartbeat);
          report(session);
          session = null;
        }

        window.asteroidsArcadeMetric = (phase, modeIndex) => {
          if (phase === 2) {
            leave();
          } else if (phase === 0 && modes[modeIndex]) {
            leave();
            selection = {
              mode: modes[modeIndex],
              loadStarted: !skipFirstLoad && document.visibilityState === "visible" ? performance.now() : null
            };
            skipFirstLoad = false;
          } else if (phase === 1 && selection?.mode === modes[modeIndex]) {
            const entering = selection;
            requestAnimationFrame(() => requestAnimationFrame(() => {
              if (selection !== entering) return;
              selection = null;
              const now = performance.now();
              const visible = document.visibilityState === "visible";
              const loadMs = entering.loadStarted === null ? 0 : Math.max(1, Math.round(now - entering.loadStarted));
              session = {
                id: crypto.randomUUID(), mode: entering.mode, elapsed: 0, sentMs: -1,
                visibleSince: visible ? now : null, loadMs: visible && loadMs > 0 && loadMs <= 300000 ? loadMs : null
              };
              report(session);
              heartbeat = setInterval(() => {
                if (session?.visibleSince != null) report(session);
              }, 30000);
            }));
          }
        };
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") resume();
          else pause();
        });
        window.addEventListener("pageshow", resume);
        window.addEventListener("pagehide", event => {
          if (event.persisted) pause();
          else leave();
        });
      }

      if (modeMetricsEnabled && typeof crypto.randomUUID === "function") trackModeSessions();

      function loadUnity() {
        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = async function () {
          await saveBridgeReady;
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
          }).then(function (runtime) {
            unityReady = true;
            loadingBar.style.display = "none";
            if (!installDialog?.open && document.activeElement === document.body) canvas.focus({ preventScroll: true });
            if (metricsEnabled) {
              setTimeout(reportArcadeVisit, 0);
            }
            // Give the playable canvas a paint and a grace period before optional downloads.
            requestAnimationFrame(() => requestAnimationFrame(() => {
              // A visible install CTA still blocks the canvas even when Unity is ready.
              if (metricsEnabled && foregroundStartup && !installDialog?.open) reportStartup();
              setTimeout(() => runtime.SendMessage("WebDeferredContent", "BeginLoading"), 1000);
            }));
          }).catch(function (message) {
            unityShowBanner(message, "error");
          });
        };
        script.onerror = function () {
          unityShowBanner("Unable to load the Asteroid Fishing runtime.", "error");
        };

        document.body.appendChild(script);
      }

      (async function bootstrap() {
        loadingBar.style.display = "flex";
        if (!(await useLatestRelease())) return;
        let safeToLoad = false;
        try {
          safeToLoad = await prepareServiceWorker();
        } catch (error) {
          if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
            console.error("Service worker migration failed.", error);
            unityShowBanner("The game cache could not be updated. Close other Asteroid Fishing tabs, then reload this page.", "error");
            return;
          }
          console.warn("Service worker registration failed; continuing with direct network loading.", error);
          safeToLoad = true;
        }
        if (safeToLoad) loadUnity();
      })();
    </script>
  </body>
</html>
