  <body>
    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1" aria-label="Asteroid Fishing game"></canvas>
      <div id="unity-loading-bar" role="status" aria-live="polite">
        <div id="unity-logo"></div>
        <div id="unity-loading-copy">CASTING INTO THE STARFIELD</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      const buildVersion = encodeURIComponent("2026.09.18.2-ff52ffd2");

      const canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(message, type) {
        const warningBanner = document.querySelector("#unity-warning");
        const entry = document.createElement("div");
        entry.textContent = message;
        entry.className = type === "error" ? "error" : "warning";
        warningBanner.appendChild(entry);
        warningBanner.style.display = "block";
        if (type !== "error") {
          setTimeout(function () {
            entry.remove();
            warningBanner.style.display = warningBanner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/2026.09.18_build2_asteroidfishing.loader.js?v=" + buildVersion;
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/2026.09.18_build2_asteroidfishing.data?v=" + buildVersion,
        frameworkUrl: buildUrl + "/2026.09.18_build2_asteroidfishing.framework.js?v=" + buildVersion,
        codeUrl: buildUrl + "/2026.09.18_build2_asteroidfishing.wasm?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ramsey Fireborn Games Studio",
        productName: "Asteroid Fishing",
        productVersion: "2026.09.18.2-ff52ffd2",
        showBanner: unityShowBanner,
      };

      async function prepareServiceWorker() {
        if (!("serviceWorker" in navigator)) return true;

        const serviceWorkerUrl = new URL("ServiceWorker.js?v=" + buildVersion, document.URL).href;
        const controller = navigator.serviceWorker.controller;

        // A previously published worker caches every Build payload. Never start
        // Unity while that worker controls this page: unregister it and make one
        // clean navigation before installing the lightweight worker.
        if (controller && controller.scriptURL !== serviceWorkerUrl) {
          const resetUrl = new URL(document.URL);
          if (resetUrl.searchParams.get("sw-reset") === buildVersion) {
            throw new Error("The previous service worker still controls the page after reset.");
          }

          const registration = await navigator.serviceWorker.getRegistration();
          if (!registration || !(await registration.unregister())) {
            throw new Error("The previous service worker could not be unregistered.");
          }

          resetUrl.searchParams.set("sw-reset", buildVersion);
          location.replace(resetUrl.href);
          return false;
        }

        await navigator.serviceWorker.register(serviceWorkerUrl, { updateViaCache: "none" });
        return true;
      }

      function loadUnity() {
        document.querySelector("#unity-loading-bar").style.display = "flex";

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
          }).then(function () {
            document.querySelector("#unity-loading-bar").style.display = "none";
          }).catch(function (message) {
            unityShowBanner(message, "error");
          });
        };
        script.onerror = function () {
          unityShowBanner("Unable to load the Asteroid Fishing runtime.", "error");
        };

        document.body.appendChild(script);
      }

      (async function bootstrap() {
        let safeToLoad = false;
        try {
          safeToLoad = await prepareServiceWorker();
        } catch (error) {
          if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
            console.error("Service worker migration failed.", error);
            unityShowBanner("The game cache could not be updated. Close other Asteroid Fishing tabs, then reload this page.", "error");
            return;
          }
          console.warn("Service worker registration failed; continuing with direct network loading.", error);
          safeToLoad = true;
        }
        if (safeToLoad) loadUnity();
      })();
    </script>
  </body>
